<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>目標手帳 Pro</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="高品質、具備原生 App 質感的個人每日目標打卡與反思手帳">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Lucide Icons Alternative / Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* 全域 App 優化 */
    * {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 輸入框例外：恢復選取與點擊 */
    input, textarea, select {
      -webkit-user-select: auto !important;
      user-select: auto !important;
      font-size: 16px !important; /* 避免 iOS Safari 聚焦時放大 */
    }

    /* 按鈕觸動回饋微動畫 */
    .btn-active-effect:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    /* 隱藏滾動條但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Safe Area Padding for Fullscreen PWA */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 16px);
    }
  </style>

  <script>
    // 繪製極簡打卡勾選圖示轉 Data URI
    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6" />
          <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
      <path d="M380 170 L210 340 L132 262" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

    const iconDataUri = 'data:image/svg+xml;base64,' + btoa(iconSvg);

    // 動態設定 Icon Link
    const iconLink = document.createElement('link');
    iconLink.rel = 'icon';
    iconLink.type = 'image/svg+xml';
    iconLink.href = iconDataUri;
    document.head.appendChild(iconLink);

    const appleIconLink = document.createElement('link');
    appleIconLink.rel = 'apple-touch-icon';
    appleIconLink.href = iconDataUri;
    document.head.appendChild(appleIconLink);

    // 動態生成 Web App Manifest Blob URL
    const manifestObj = {
      name: "目標手帳 Pro",
      short_name: "目標手帳",
      description: "個人每日目標打卡與反思手帳",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#2563eb",
      icons: [
        {
          src: iconDataUri,
          sizes: "512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestUrl;
    document.head.appendChild(manifestLink);
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-full flex flex-col justify-between selection:bg-blue-500 selection:text-white">

  <!-- Top Navigation & Dashboard Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 pt-safe px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i class="fa-solid font-bold fa-check text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide text-white">目標手帳 Pro</h1>
          <p class="text-xs text-slate-400" id="current-date-text">2026年10月20日 星期二</p>
        </div>
      </div>
      <button id="theme-toggle-btn" class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center btn-active-effect">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 py-5 space-y-6 overflow-y-auto no-scrollbar">

    <!-- Overall Progress Banner -->
    <section class="bg-gradient-to-br from-slate-800 to-slate-800/80 rounded-2xl p-5 border border-slate-700/60 shadow-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="flex items-center justify-between mb-3">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-blue-400">Today Overview</span>
          <h2 class="text-2xl font-extrabold text-white mt-0.5">今日完成進度</h2>
        </div>
        <!-- Streak Counter -->
        <div class="flex items-center space-x-1.5 bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-full">
          <i class="fa-solid fa-fire text-amber-500 text-sm animate-pulse"></i>
          <span class="text-xs font-bold text-amber-400" id="streak-count-text">連續 0 天</span>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400">達成率</span>
          <span class="font-bold text-blue-400" id="progress-percent-text">0%</span>
        </div>
        <div class="w-full h-3 bg-slate-700/80 rounded-full overflow-hidden p-0.5 border border-slate-600/30">
          <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Category Filter Tabs -->
    <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1" id="category-tabs">
      <button data-cat="all" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20 btn-active-effect">全部</button>
      <button data-cat="健康" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 btn-active-effect">🏃 運動健康</button>
      <button data-cat="學習" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 btn-active-effect">📚 學習閱讀</button>
      <button data-cat="工作" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 btn-active-effect">💼 工作效能</button>
      <button data-cat="生活" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 btn-active-effect">🌱 生活習慣</button>
    </div>

    <!-- Habit Cards List -->
    <section class="space-y-3" id="habits-list-container">
      <!-- Cards rendered dynamically via JS -->
    </section>

    <!-- Daily Reflection Note Section -->
    <section class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-regular fa-pen-to-square text-blue-400"></i>
          <h3 class="text-sm font-bold text-white">今日反思與隨手記</h3>
        </div>
        <span class="text-[10px] text-slate-400" id="reflection-saved-status">已自動保存</span>
      </div>
      <textarea id="reflection-input" placeholder="寫下今天完成目標的心得或感想..." class="w-full h-24 bg-slate-900/80 border border-slate-700/80 rounded-xl p-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors resize-none"></textarea>
    </section>

  </main>

  <!-- Floating Action Button & Bottom Bar -->
  <div class="sticky bottom-0 z-30 bg-slate-900/90 backdrop-blur-md border-t border-slate-800/80 px-4 py-3 pb-safe">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <p class="text-xs text-slate-400">點擊卡片圓圈即可完成打卡</p>
      <button id="open-add-modal-btn" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm shadow-lg shadow-blue-500/25 flex items-center space-x-2 btn-active-effect">
        <i class="fa-solid fa-plus"></i>
        <span>新增目標</span>
      </button>
    </div>
  </div>

  <!-- Add Habit Modal Dialog -->
  <div id="add-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-sm hidden transition-opacity duration-300">
    <div class="bg-slate-800 border border-slate-700/80 rounded-t-3xl sm:rounded-2xl p-6 w-full max-w-md space-y-5 shadow-2xl transform transition-transform duration-300 translate-y-full sm:translate-y-0">
      
      <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
        <h3 class="text-lg font-bold text-white">新增打卡目標</h3>
        <button id="close-add-modal-btn" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="add-habit-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">目標名稱</label>
          <input type="text" id="habit-title-input" placeholder="例如：每天晨跑 30 分鐘" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">分類標籤</label>
          <select id="habit-category-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="健康">🏃 運動健康</option>
            <option value="學習">📚 學習閱讀</option>
            <option value="工作">💼 工作效能</option>
            <option value="生活">🌱 生活習慣</option>
          </select>
        </div>

        <div class="pt-2 flex space-x-3">
          <button type="button" id="cancel-add-btn" class="flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-sm font-medium btn-active-effect">取消</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold shadow-lg shadow-blue-600/30 btn-active-effect">確認建立</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

  <script>
    // State Management
    let habits = [];
    let activeCategory = 'all';
    let lastCheckDate = '';
    let currentStreak = 0;

    // Helper: Toast Message
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-slate-800/90 border border-slate-700 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-2xl backdrop-blur-md transition-all duration-300 transform -translate-y-2 opacity-0 flex items-center space-x-2';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('-translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('-translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Format Date String (YYYY-MM-DD)
    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    // Load Data from LocalStorage
    function loadData() {
      const today = getTodayString();
      const savedDate = localStorage.getItem('pwa_habits_last_date');
      const savedHabits = localStorage.getItem('pwa_habits_list');
      const savedStreak = localStorage.getItem('pwa_habits_streak');
      const savedReflection = localStorage.getItem(`pwa_reflection_${today}`);

      // Auto Reset check-in status if date changed
      if (savedDate !== today) {
        if (savedHabits) {
          let list = JSON.parse(savedHabits);
          list.forEach(h => h.completedToday = false);
          habits = list;
        } else {
          initDefaultHabits();
        }
        localStorage.setItem('pwa_habits_last_date', today);
      } else {
        habits = savedHabits ? JSON.parse(savedHabits) : [];
        if (habits.length === 0) initDefaultHabits();
      }

      currentStreak = savedStreak ? parseInt(savedStreak, 10) : 0;
      
      if (savedReflection) {
        document.getElementById('reflection-input').value = savedReflection;
      }

      saveData();
      renderHabits();
      updateDashboard();
    }

    // Initialize Default Demo Data
    function initDefaultHabits() {
      habits = [
        { id: '1', title: '每天喝足 2000cc 水', category: '健康', completedToday: false },
        { id: '2', title: '閱讀書籍 20 頁', category: '學習', completedToday: false },
        { id: '3', title: '整理今日工作筆記', category: '工作', completedToday: false }
      ];
    }

    // Save Data to LocalStorage
    function saveData() {
      localStorage.setItem('pwa_habits_list', JSON.stringify(habits));
      localStorage.setItem('pwa_habits_streak', currentStreak.toString());
    }

    // Render Habits
    function renderHabits() {
      const container = document.getElementById('habits-list-container');
      container.innerHTML = '';

      const filtered = activeCategory === 'all' 
        ? habits 
        : habits.filter(h => h.category === activeCategory);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-slate-800/40 rounded-2xl border border-dashed border-slate-700/60">
            <i class="fa-regular fa-clipboard text-3xl text-slate-600 mb-2"></i>
            <p class="text-xs text-slate-400">目前尚無此分類目標</p>
          </div>
        `;
        return;
      }

      filtered.forEach(habit => {
        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl border transition-all duration-200 flex items-center justify-between ${
          habit.completedToday 
            ? 'bg-slate-800/40 border-emerald-500/30 text-slate-400' 
            : 'bg-slate-800 border-slate-700/80 text-white'
        }`;

        card.innerHTML = `
          <div class="flex items-center space-x-3.5 flex-1 min-w-0">
            <button onclick="toggleHabit('${habit.id}')" class="w-7 h-7 rounded-full flex items-center justify-center transition-all ${
              habit.completedToday 
                ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30' 
                : 'border-2 border-slate-600 hover:border-blue-500'
            } btn-active-effect">
              ${habit.completedToday ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
            </button>
            <div class="truncate">
              <h4 class="font-semibold text-sm ${habit.completedToday ? 'line-through text-slate-400' : 'text-slate-100'}">${escapeHtml(habit.title)}</h4>
              <span class="inline-block mt-0.5 text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 text-slate-300 border border-slate-600/40">${habit.category}</span>
            </div>
          </div>
          <button onclick="deleteHabit('${habit.id}')" class="text-slate-500 hover:text-rose-400 p-2 text-xs transition-colors btn-active-effect">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;

        container.appendChild(card);
      });
    }

    // Toggle Check-in Function
    window.toggleHabit = function(id) {
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      habit.completedToday = !habit.completedToday;
      
      saveData();
      renderHabits();
      updateDashboard();

      if (habit.completedToday) {
        showToast(`已完成目標：${habit.title}`);
      }
    };

    // Delete Habit Function
    window.deleteHabit = function(id) {
      habits = habits.filter(h => h.id !== id);
      saveData();
      renderHabits();
      updateDashboard();
      showToast('目標已刪除');
    };

    // Update Overall Stats
    function updateDashboard() {
      const total = habits.length;
      const completedCount = habits.filter(h => h.completedToday).length;
      const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);

      document.getElementById('progress-percent-text').innerText = `${percent}%`;
      document.getElementById('progress-bar-fill').style.width = `${percent}%`;

      // Simple Streak Counter Calculation
      if (percent === 100 && total > 0) {
        currentStreak = Math.max(currentStreak, 1);
      }
      document.getElementById('streak-count-text').innerText = `連續 ${currentStreak} 天`;
    }

    // Escape HTML to prevent XSS
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Modal Control Functions
    const modal = document.getElementById('add-modal');
    function openModal() {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.firstElementChild.classList.remove('translate-y-full');
      }, 10);
    }
    function closeModal() {
      modal.firstElementChild.classList.add('translate-y-full');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // Event Listeners Initialization
    document.addEventListener('DOMContentLoaded', () => {
      // Date Display
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('current-date-text').innerText = now.toLocaleDateString('zh-TW', options);

      loadData();

      // Modal Events
      document.getElementById('open-add-modal-btn').addEventListener('click', openModal);
      document.getElementById('close-add-modal-btn').addEventListener('click', closeModal);
      document.getElementById('cancel-add-btn').addEventListener('click', closeModal);

      // Add Habit Form Submit
      document.getElementById('add-habit-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const titleInput = document.getElementById('habit-title-input');
        const categoryInput = document.getElementById('habit-category-input');

        const newHabit = {
          id: Date.now().toString(),
          title: titleInput.value.trim(),
          category: categoryInput.value,
          completedToday: false
        };

        habits.unshift(newHabit);
        saveData();
        renderHabits();
        updateDashboard();

        titleInput.value = '';
        closeModal();
        showToast('新目標新增成功');
      });

      // Category Filter Tabs
      document.getElementById('category-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.cat-btn');
        if (!btn) return;

        document.querySelectorAll('.cat-btn').forEach(b => {
          b.className = 'cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-slate-800 text-slate-400 border border-slate-700 btn-active-effect';
        });

        btn.className = 'cat-btn px-4 py-2 rounded-xl text-xs font-medium transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20 btn-active-effect';
        activeCategory = btn.dataset.cat;
        renderHabits();
      });

      // Auto Save Daily Reflection Note
      const reflectionInput = document.getElementById('reflection-input');
      reflectionInput.addEventListener('input', () => {
        const today = getTodayString();
        localStorage.setItem(`pwa_reflection_${today}`, reflectionInput.value);
        document.getElementById('reflection-saved-status').innerText = '儲存中...';
        setTimeout(() => {
          document.getElementById('reflection-saved-status').innerText = '已自動保存';
        }, 500);
      });

      // Simple Light/Dark Theme Toggle
      let isDark = true;
      document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        isDark = !isDark;
        document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        showToast(`已切換至 ${isDark ? '深色' : '淺色'} 視效`);
      });
    });

    // Register Dynamic Service Worker for Offline PWA Capability
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'pwa-habits-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl)
        .then(() => console.log('PWA ServiceWorker registered successfully.'))
        .catch(err => console.log('ServiceWorker registration error:', err));
    }
  </script>
</body>
</html>
